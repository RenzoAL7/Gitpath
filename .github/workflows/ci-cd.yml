name: GitPath CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/renzoal7/gitpath

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Test simulator behavior
        run: npm test

  container:
    name: Build container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  update-gitops:
    name: Propose GitOps image update
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout K3s-Cortex
        uses: actions/checkout@v4
        with:
          repository: RenzoAL7/K3s-Cortex
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
          fetch-depth: 1

      - name: Pin the released image SHA
        working-directory: cortex
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          MANIFEST="apps/gitpath/overlays/prod/kustomization.yaml"
          test -f "$MANIFEST"
          sed -i -E "s|^    newTag:.*$|    newTag: ${IMAGE_TAG}|" "$MANIFEST"
          grep -n "newTag:" "$MANIFEST"
          git diff --check

      - name: Open GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
          add-paths: apps/gitpath/overlays/prod/kustomization.yaml
          # Reuse one promotion branch so a new release updates the pending PR
          # instead of creating a pile of competing deployment PRs.
          branch: automation/gitpath-prod
          delete-branch: true
          base: main
          commit-message: "chore(gitpath): deploy sha-${{ github.sha }}"
          title: "chore(gitpath): deploy sha-${{ github.sha }}"
          body: |
            Automated image promotion from `RenzoAL7/Gitpath`.

            - Source commit: `${{ github.sha }}`
            - Image: `ghcr.io/renzoal7/gitpath:sha-${{ github.sha }}`
            - Argo CD application: `gitpath-prod`

            Merge this PR to let Argo CD synchronize the production workload.
